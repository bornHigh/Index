<script>
let chapters = [], idx = 0, currentColumnPage = 0, totalColumnPages = 1, resizeTimeout = null;
const config = {
  get size() { return parseInt(localStorage.getItem("epub-font-size") || "20"); },
  set size(v) { localStorage.setItem("epub-font-size", v); this.apply(); },
  get space() { return localStorage.getItem("epub-line-height") || "1.6"; },
  set space(v) { localStorage.setItem("epub-line-height", v); this.apply(); },
  get width() { return localStorage.getItem("epub-reader-width") || "800px"; },
  set width(v) { localStorage.setItem("epub-reader-width", v); this.apply(); },
  get theme() { return localStorage.getItem("epub-theme") || "cream"; },
  set theme(v) { localStorage.setItem("epub-theme", v); this.apply(); },
  apply() {
    document.documentElement.style.setProperty("--reader-font-size", this.size + "px");
    document.documentElement.style.setProperty("--reader-line-height", this.space);
    document.documentElement.style.setProperty("--reader-width", this.width);
    document.body.setAttribute("data-theme", this.theme);
    document.querySelectorAll(".theme-btn").forEach(b => b.classList.toggle("active", b.dataset.val === this.theme));
    document.querySelectorAll("#space-low, #space-med, #space-high").forEach(b => b.classList.toggle("active", b.dataset.val === this.space));
    document.querySelectorAll("#width-narrow, #width-normal, #width-wide").forEach(b => b.classList.toggle("active", b.dataset.val === this.width));
    setTimeout(() => { updatePaginationMeasurements(); applyColumnShift(); }, 100);
  }
};
document.getElementById("choose").onclick = () => document.getElementById("file").click();
document.getElementById("file").addEventListener("change", e => { if(e.target.files && e.target.files[0]) openBook(e.target.files[0]); });
document.getElementById("menu").onclick = (e) => { e.stopPropagation(); document.getElementById("drawer").classList.toggle("open"); };
document.getElementById("drawer-backdrop").onclick = () => document.getElementById("drawer").classList.remove("open");
document.getElementById("settings-btn").onclick = (e) => { e.stopPropagation(); document.getElementById("settings-dropdown").classList.toggle("open"); };
document.onclick = () => { document.getElementById("settings-dropdown").classList.remove("open"); };
document.getElementById("settings-dropdown").onclick = (e) => e.stopPropagation();
document.getElementById("font-increase").onclick = () => { config.size = Math.min(36, config.size + 2); };
document.getElementById("font-decrease").onclick = () => { config.size = Math.max(14, config.size - 2); };
document.querySelectorAll(".theme-btn").forEach(b => b.onclick = () => { config.theme = b.dataset.val; });
document.querySelectorAll("#space-low, #space-med, #space-high").forEach(b => b.onclick = () => { config.space = b.dataset.val; });
document.querySelectorAll("#width-narrow, #width-normal, #width-wide").forEach(b => b.onclick = () => { config.width = b.dataset.val; });
document.getElementById("fullscreen-btn").onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); };
document.getElementById("zone-left").onclick = (e) => { e.stopPropagation(); navigatePage(-1); };
document.getElementById("zone-right").onclick = (e) => { e.stopPropagation(); navigatePage(1); };
document.getElementById("viewport").onclick = () => { document.body.classList.toggle("app-hidden"); };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); navigatePage(1); document.body.classList.add("app-hidden"); }
  if (e.key === "ArrowLeft") { e.preventDefault(); navigatePage(-1); document.body.classList.add("app-hidden"); }
  if (e.key === "Escape") document.body.classList.remove("app-hidden");
});
let touchStartX = 0, touchEndX = 0;
document.getElementById("viewport").addEventListener("touchstart", e => { touchStartX = e.changedTouches.screenX; }, {passive: true});
document.getElementById("viewport").addEventListener("touchend", e => { touchEndX = e.changedTouches.screenX; let sweepDistance = touchEndX - touchStartX; if (Math.abs(sweepDistance) > 60) { if (sweepDistance > 0) navigatePage(-1); else navigatePage(1); document.body.classList.add("app-hidden"); } }, {passive: true});

async function decompressDeflate(bytes) {
  const s = new ReadableStream({ start(c) { c.enqueue(bytes); c.close(); } }).pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

async function openBook(fileObj) {
  try {
    document.getElementById("title").textContent = "Opening " + fileObj.name + "...";
    const buf = await fileObj.arrayBuffer(), view = new DataView(buf), u8 = new Uint8Array(buf);
    let entries = {}, offset = 0;
    while (offset < buf.byteLength - 30) {
      if (view.getUint32(offset, true) === 0x04034b50) {
        let comp = view.getUint16(offset + 8, true), cSize = view.getUint32(offset + 18, true), nLen = view.getUint16(offset + 26, true), eLen = view.getUint16(offset + 28, true);
        let name = new TextDecoder().decode(u8.subarray(offset + 30, offset + 30 + nLen)), start = offset + 30 + nLen + eLen, data = u8.subarray(start, start + cSize);
        if (comp === 0) entries[name] = data;
        else if (comp === 8) { try { entries[name] = await decompressDeflate(data); } catch (err) {} }
        offset = start + cSize;
      } else offset++;
    }
    let ck = Object.keys(entries).find(k => k.toLowerCase().replace(/\\/g, '/').endsWith("meta-inf/container.xml"));
    if (!ck) throw Error("Container missing.");
    let containerDoc = new DOMParser().parseFromString(new TextDecoder().decode(entries[ck]), "text/xml");
    let rootfiles = containerDoc.getElementsByTagName("rootfile"); if (!rootfiles || !rootfiles.length) throw Error("OPF shortcut unlinked.");
    let opfPath = rootfiles[0].getAttribute("full-path"); if (!opfPath) throw Error("OPF path broken.");
    let opfKey = Object.keys(entries).find(k => k.toLowerCase().replace(/\\/g, '/') === opfPath.toLowerCase());
    if (!opfKey) throw Error("OPF data dropped.");
    
    let opfDoc = new DOMParser().parseFromString(new TextDecoder().decode(entries[opfKey]), "text/xml");
    let base = opfPath.includes("/") ? opfPath.slice(0, opfPath.lastIndexOf("/") + 1) : "";
    let manifest = {};
    let items = opfDoc.getElementsByTagName("item");
    for (let i = 0; i < items.length; i++) {
      let id = items[i].getAttribute("id"), href = items[i].getAttribute("href"), media = items[i].getAttribute("media-type");
      if (id && href) manifest[id] = { href: decodeURIComponent(href), media: media || "" };
    }
    
    chapters = [];
    let itemrefs = opfDoc.getElementsByTagName("itemref");
    for (let i = 0; i < itemrefs.length; i++) {
      let idref = itemrefs[i].getAttribute("idref"); if (!idref || !manifest[idref]) continue;
      let item = manifest[idref]; if (!/xhtml|html|xml/i.test(item.media)) continue;
      let path = norm(base + item.href), mk = Object.keys(entries).find(k => norm(k).toLowerCase() === path.toLowerCase());
      if (mk) {
        let htmlStr = new TextDecoder().decode(entries[mk]), parser = new DOMParser(), docEl = parser.parseFromString(htmlStr, "text/html");
        docEl.querySelectorAll("img,image").forEach(img => {
          let src = img.getAttribute("src") || img.getAttribute("xlink:href") || "";
          if (src && !src.startsWith("data:")) {
            let ik = Object.keys(entries).find(k => norm(k).toLowerCase() === norm(base + src).toLowerCase());
            if (ik) {
              let ext = ik.split('.').pop().toLowerCase(), mime = ext === 'png' ? 'image/png' : ext === 'gif' ? 'image/gif' : 'image/jpeg';
              img.setAttribute("src", URL.createObjectURL(new Blob([entries[ik]], { type: mime })));
              img.removeAttribute("xlink:href");
            }
          }
        });
        let tEl = docEl.querySelector("title"), hEl = docEl.querySelector("h1, h2, h3");
        let cName = tEl ? tEl.textContent.trim() : hEl ? hEl.textContent.trim() : "";
        if (!cName) {
          let textSample = docEl.body.textContent.trim().substring(0, 30);
          cName = textSample ? textSample + "..." : "Section " + (chapters.length + 1);
        }
        chapters.push({ html: docEl.body.innerHTML, name: cName, bName: fileObj.name });
      }
    }
    if (!chapters.length) throw Error("No readable layers.");
    buildToc();
    let saved = localStorage.getItem("ep-pos-" + fileObj.name);
    if (saved) { let p = saved.split(":"); idx = parseInt(p) || 0; currentColumnPage = parseInt(p) || 0; } else { idx = 0; currentColumnPage = 0; }
    show(idx, true);
    document.getElementById("drop").classList.add("hidden");
    document.body.classList.add("app-hidden");
  } catch (e) { document.getElementById("title").textContent = "Local EPUB Reader"; alert("Error: " + e.message); }
}
function norm(p) { let a = []; for (let x of p.replace(/\\/g, '/').split("/")) { if (!x || x == ".") continue; x === ".." ? a.pop() : a.push(x); } return a.join("/"); }

function buildToc() {
  const t = document.getElementById("toc"); t.innerHTML = "";
  chapters.forEach((c, i) => {
    let b = document.createElement("button"); b.className = "chapter"; b.textContent = c.name;
    b.onclick = () => { document.getElementById("drawer").classList.remove("open"); show(i, false); };
    t.appendChild(b);
  });
}
function show(i, useSaved = false) {
  if (i < 0 || i >= chapters.length) return; idx = i;
  const reader = document.getElementById("reader"); reader.innerHTML = chapters[idx].html;
  document.getElementById("title").textContent = chapters[idx].name;
  document.querySelectorAll(".chapter").forEach((b, j) => b.classList.toggle("active", j === idx));
  if (!useSaved) currentColumnPage = 0;
  const imgs = reader.querySelectorAll("img");
  if (imgs.length > 0) {
    let loaded = 0;
    imgs.forEach(img => {
      if (img.complete) { loaded++; if (loaded === imgs.length) renderLifecycle(useSaved); }
      else { img.onload = img.onerror = () => { loaded++; if (loaded === imgs.length) renderLifecycle(useSaved); }; }
    });
  } else { renderLifecycle(useSaved); }
}
function renderLifecycle(useSaved) {
  updatePaginationMeasurements();
  if (useSaved) {
    if (currentColumnPage >= totalColumnPages) currentColumnPage = totalColumnPages - 1;
    if (currentColumnPage < 0) currentColumnPage = 0;
  }
  applyColumnShift();
}
function updatePaginationMeasurements() {
  const frame = document.getElementById("reader-frame"), reader = document.getElementById("reader"); if (!frame || !reader) return;
  const s = window.getComputedStyle(reader), w = parseFloat(s.columnWidth) || frame.clientWidth, g = parseFloat(s.columnGap) || 0;
  totalColumnPages = Math.max(1, Math.ceil(reader.scrollWidth / (w + g)));
  document.getElementById("progress-text").textContent = `Section ${idx + 1} of ${chapters.length} • Page ${currentColumnPage + 1} of ${totalColumnPages}`;
}
function applyColumnShift() {
  const frame = document.getElementById("reader-frame"), reader = document.getElementById("reader"); if (!frame || !reader) return;
  const s = window.getComputedStyle(reader), w = parseFloat(s.columnWidth) || frame.clientWidth, g = parseFloat(s.columnGap) || 0;
  reader.style.transform = `translateX(-${currentColumnPage * (w + g)}px)`;
  document.getElementById("progress-text").textContent = `Section ${idx + 1} of ${chapters.length} • Page ${currentColumnPage + 1} of ${totalColumnPages}`;
  if (chapters[idx]) localStorage.setItem("ep-pos-" + chapters[idx].bName, `${idx}:${currentColumnPage}`);
}
function navigatePage(d) {
  let t = currentColumnPage + d;
  if (t >= 0 && t < totalColumnPages) { currentColumnPage = t; applyColumnShift(); }
  else if (t < 0 && idx > 0) { idx--; currentColumnPage = 9999; show(idx, true); }
  else if (t >= totalColumnPages && idx < chapters.length - 1) { idx++; currentColumnPage = 0; show(idx, false); }
}
window.onresize = () => { clearTimeout(resizeTimeout); resizeTimeout = setTimeout(() => { updatePaginationMeasurements(); applyColumnShift(); }, 150); };
config.apply();
</script>
</body>
</html>
